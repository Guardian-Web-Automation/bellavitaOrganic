name: Playwright Daily Suite

on:
  # Daily at 20:30 UTC (= 02:00 IST).
  schedule:
    - cron: '30 20 * * *'
  # Manual "Run workflow" button.
  workflow_dispatch:

# Avoid overlapping scheduled + manual runs stepping on each other.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright suite (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Storefront config + anti-bot. Add these as repository secrets:
      #   Settings → Secrets and variables → Actions → New repository secret
      BASE_URL: ${{ vars.BASE_URL || 'https://bellavitaorganic.com/' }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      TWO_CAPTCHA_API_KEY: ${{ secrets.TWO_CAPTCHA_API_KEY }}
      CF_TURNSTILE_SITEKEY: ${{ secrets.CF_TURNSTILE_SITEKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Both projects (Desktop Chrome + Pixel 5) use the Chromium engine.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Slack
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/slack-summary.js

      - name: Fail job if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          echo "Playwright tests reported failures — failing the job."
          exit 1
